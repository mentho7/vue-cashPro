# CashPro Nginx 完整站点配置 (参考)
# 适用系统: Ubuntu 24.04 LTS
#
# 部署方式:
#   方式一 (推荐): 运行 server-setup.sh，自动写入此配置
#   方式二 (手动): 复制本文件到 /etc/nginx/sites-available/cashpro
#                  然后 ln -s /etc/nginx/sites-available/cashpro /etc/nginx/sites-enabled/
#
# 注意: Ubuntu Nginx 站点配置目录是 /etc/nginx/sites-available/ → sites-enabled/
#       (不是 RHEL 系的 /etc/nginx/conf.d/)

server {
    listen 80;
    listen [::]:80;
    server_name minthol.cn;

    # 前端静态站点
    root /var/www/cashpro/dist;
    index index.html;

    # SPA 路由: 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 数据 API（只读，供前端 fetch）─────────────────
    location /data/ {
        alias /var/www/cashpro/data/;

        # 允许跨域（前端从其他端口开发时也能访问）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        # 不缓存数据文件，确保每次请求都是最新的
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;

        # JSON MIME 类型
        types {
            application/json json;
        }

        # 只允许 GET 请求
        limit_except GET {
            deny all;
        }

        # 禁止列出目录
        autoindex off;
    }

    # 静态资源缓存 (JS/CSS/图片)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}

# ── HTTPS 配置 (certbot 自动生成，这里仅作参考) ──
